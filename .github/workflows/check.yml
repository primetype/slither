name: Check

# Stage 1 of the pipeline: the static gate. Formatting, lints, intra-doc
# links, MSRV and the supply-chain audit. The `Test` workflow triggers on
# this workflow's completion (via `workflow_run`) and only runs its jobs
# when this one concluded successfully. Mirrors hiss's pipeline.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  build:
    # The gate table's first row, verbatim. Clippy type-checks every target
    # but does not codegen, and `cargo test` codegens without `--all-targets`
    # — this is the one job that proves the row as written.
    name: build (all features, all targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-features --all-targets

  wasm:
    # Ruling 277: the lib — including `test-util`'s in-memory FlakyWire —
    # compiles for wasm32-wasip1 (tokio/net is target-gated, the UdpSocket
    # Wire impl cfg'd out on wasm). Lib-only on purpose: tests and examples
    # legitimately need tokio/net, so no `--all-targets` here.
    name: wasm32-wasip1 (lib · test-util)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-wasip1
      - run: cargo check --target wasm32-wasip1 --features test-util

  clippy-doc:
    # One OS is enough here: slither has no target-gated code (the Apple
    # backend lives in hiss); the Test workflow still runs a macOS leg for
    # the real-UDP-socket path.
    name: clippy + doc-links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (all features, all targets)
        run: cargo clippy --all-features --all-targets -- -D warnings
      # `cargo doc` caches, and a link can break in one feature set while
      # the other stays green (`test-util` adds the `testutil` module) — so
      # clean and check BOTH with warnings-as-errors.
      - name: doc intra-links (default features)
        run: cargo clean --doc && cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: doc intra-links (all features)
        run: cargo clean --doc && cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  features:
    # **[RATIFIED 2026/08/18 — ruling 259(vii)]** One cheap leg per feature,
    # in isolation. `clippy-doc` above builds only the two extreme points of
    # the lattice — all-off (`cargo test`, no `-D warnings`) and all-on
    # (`--all-features`) — and ruling 246's defect lived at an interior
    # point: `Connection::clone_handle` was dead code with `tower` off, and
    # no gate compiled a combination in which it warned.
    #
    # Curated, not a power set: `default = []`, so each single feature is
    # exactly one interior point, and those four are where a `cfg` mistake
    # actually lands. Pairs are covered by `--all-features` for compilation
    # and by nothing for deadness, which is the trade this job accepts.
    #
    # **`clippy`, not `cargo check`.** The class this exists to catch is a
    # *warning* — `dead_code` — and `cargo check` exits 0 on warnings, so a
    # check-only job would have been green on ruling 246's tree. `clippy
    # -- -D warnings` scopes the denial to slither itself, unlike
    # `RUSTFLAGS`, which would fail on a dependency's warnings.
    #
    # One OS and stable only: this axis is about feature `cfg`s, not
    # targets or toolchains, both of which the jobs around it cover.
    name: "features (${{ matrix.feature }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: [test-util, sink, codec, tower]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Per-feature key: matrix instances share one by default, so
          # without this the four legs evict each other every run.
          key: ${{ matrix.feature }}
      - name: "clippy (${{ matrix.feature }} alone, all targets)"
        run: cargo clippy --no-default-features --features ${{ matrix.feature }} --all-targets -- -D warnings

  msrv:
    # Pinned to the declared MSRV (Cargo.toml `rust-version`). Policy:
    # a recent stable, floored at `stable - 3`; bump both in lockstep.
    name: MSRV (1.96)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@v2
      - name: cargo check on the declared MSRV (all features)
        run: cargo check --all-features --all-targets

  deny:
    name: cargo-deny (advisories · licenses · bans · sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
