<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img"
     aria-label="slither's architecture: two pure state machines under one !Send driver task, handles above them, optional compat adapters on top; the driver owns the Wire, which is a UDP socket or an in-memory FlakyWire.">
  <title>slither's architecture</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#4FB3B4"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 8" refX="1" refY="4" markerWidth="10" markerHeight="8"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M10 0 L0 4 L10 8 Z" fill="#4FB3B4"/>
    </marker>
  </defs>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <g fill="#1B4A44" stroke="#4FB3B4" stroke-width="2">
      <rect x="42" y="18" width="618" height="64" rx="8"/>
      <rect x="42" y="112" width="618" height="64" rx="8"/>
      <rect x="42" y="206" width="618" height="64" rx="8"/>
      <rect x="42" y="300" width="618" height="64" rx="8"/>
      <rect x="711" y="121" width="158" height="46" rx="8"/>
      <rect x="711" y="207" width="158" height="46" rx="8"/>
    </g>
    <g text-anchor="middle" font-size="21" font-weight="600" fill="#F0E9DA">
      <text x="351" y="46">core::Endpoint · core::Connection</text>
      <text x="351" y="140">shell: one !Send driver task</text>
      <text x="351" y="234">Endpoint · Connection · BiStream · …</text>
      <text x="351" y="328">compat: AsyncRead/Write · Stream/Sink · Codec · tower</text>
      <text x="790" y="151">Wire</text>
      <text x="790" y="237">UDP socket</text>
    </g>
    <g text-anchor="middle" font-size="15" fill="#8FB6AE">
      <text x="351" y="69">pure state machines — no I/O, no clock</text>
      <text x="351" y="163">owns the cores, owns the Wire</text>
      <text x="351" y="257">your code holds these</text>
      <text x="351" y="351">optional, feature-gated</text>
    </g>
    <g stroke="#4FB3B4" stroke-width="2" fill="none">
      <path d="M22 108 L22 86" marker-end="url(#ah)"/>
      <path d="M22 202 L22 180" marker-end="url(#ah)"/>
      <path d="M790 171 L790 203" marker-start="url(#ahr)" marker-end="url(#ah)"/>
      <line x1="660" y1="144" x2="711" y2="144" stroke-opacity="0.55"/>
    </g>
    <g font-size="15" fill="#8FB6AE">
      <text x="42" y="102">poll_output() to Timeout</text>
      <text x="42" y="196">handles</text>
    </g>
    <g text-anchor="middle" font-size="15" fill="#8FB6AE">
      <text x="790" y="280">or FlakyWire, in memory,</text>
      <text x="790" y="300">on a paused clock</text>
    </g>
  </g>
</svg>
